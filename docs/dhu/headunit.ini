; Desktop Head Unit config for the AA Tube lab.
; Usage: desktop-head-unit -c docs/dhu/headunit.ini
; Sensor keys are from https://developer.android.com/training/cars/testing/dhu
; Data sent with the `speed`, `gear`, `parking_brake` and `location` console
; commands is ignored unless the matching sensor is enabled here.
; Verify [general] keys against your DHU version (`desktop-head-unit --help`).
[general]
touch = true
resolution = 1280x720

[sensors]
speed = true
gear = true
parking_brake = true
location = true
driving_status = true
night_mode = true
